# Netlify Build & Deployment Configuration
# Dr. B.R. Ambedkar Digital Heritage Archive

[build]
  # Folder containing HTML, CSS, JS and assets
  publish = "frontend"

# Cache control headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Proxy API calls directly to the live Python cloud backend (Render / Railway)
# NOTE: Replace 'ambedkar-api.onrender.com' with your actual Render service URL if different
[[redirects]]
  from = "/api/*"
  to = "https://ambedkar-api-81k6.onrender.com/api/:splat"
  status = 200
  force = true

# Single-Page fallback redirect for web navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
